<!doctype html>
<html>
  <head>
    <title>Job Search App</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h1>Job Search</h1>

      <form action="/jobs" method="get">
        <input
          type="text"
          name="query"
          placeholder="Job role + location (e.g. python developer london)"
          required
        />
        <button type="submit">Search</button>
      </form>

      {% for job in jobs %}
      <div class="job-card">
        <h3>{{ job.title }}</h3>
        <div class="meta">
          {{ job.company }} • {{ job.location }} • {{ job.posted }}
        </div>
        <div class="meta">Source: {{ job.publisher }}</div>
        <a class="apply" href="{{ job.link }}" target="_blank">Apply →</a>
      </div>
      {% endfor %}
    </div>
  </body>
</html>
